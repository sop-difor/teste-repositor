name: Retry Ampere A1 creation

# Tenta criar a instância Ampere A1 (Always Free) da GECOPE a cada 20 minutos, até a
# capacidade da Oracle liberar na região sa-saopaulo-1. Objetivo: migrar o whatsapp-proxy
# para longe da limitação de RAM da VM.Standard.E2.1.Micro (1GB) atual sem precisar de
# alguém voltando manualmente no console da Oracle. Ver server/whatsapp-proxy/DEPLOY.md.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  try-create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar OCI CLI
        run: pip install oci-cli

      - name: Configurar credenciais da OCI
        run: |
          mkdir -p ~/.oci
          printf '%s' "${{ secrets.OCI_API_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=sa-saopaulo-1
          key_file=~/.oci/key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Preparar chave SSH pública da instância
        run: |
          cat > /tmp/ampere-key.pub <<'EOF'
          ssh-rsa  sop_difor@d1d2462bfbb2
          EOF

      - name: Tentar criar a instância Ampere A1
        id: try
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_SUBNET_ID: ocid1.subnet.oc1.sa-saopaulo-1.aaaaaaaa7bqmztc43vwa3jw55xxglxqznxd7xdvqaq3b2ykxjxz2ikwhjbfa
          SSH_PUBLIC_KEY_FILE: /tmp/ampere-key.pub
        run: bash .github/scripts/try-create-ampere.sh

      - name: Notificar sucesso (abre issue)
        if: steps.try.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "✅ Instância Ampere A1 criada — GECOPE WhatsApp" \
            --body "A instância Ampere A1 (Always Free) foi criada com sucesso. IP público: ${{ steps.try.outputs.ip }}. Próximo passo: seguir o DEPLOY.md para subir o stack lá e migrar o WHATSAPP_PROXY_URL. Depois de confirmar que está tudo funcionando na nova VM, desative este workflow (Actions > Retry Ampere A1 creation > ... > Disable workflow) para não continuar tentando criar instâncias extras."
