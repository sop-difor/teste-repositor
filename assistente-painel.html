<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Assistente · GECOPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- F7: painel de uso/falhas do Assistente de Dados. Mesmo login do GECOPE de
     assistente.html (config.js/database.js); sem checagem de cargo por
     decisão do usuário (05/09/2026) — revisitar na F8. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="database.js"></script>
<style>
  :root {
    --bg-page: #ffffff;
    --bg-card-usuario: #f2f2f0;
    --border-soft: #e8e8e5;
    --text-primary: #262624;
    --text-secondary: #6b6b68;
    --text-tertiary: #9c9c98;
    --accent: #4f46e5;
    --accent-soft: #eef0fd;
    --erro-texto: #b3261e;
    --erro-fundo: #fdf2f2;
    --erro-borda: #f5c2c2;
    --ok-texto: #1a7f43;
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --largura-conteudo: 920px;
  }

  html[data-theme="escuro"] {
    --bg-page: #1a1a18;
    --bg-card-usuario: #2a2a27;
    --border-soft: rgba(255,255,255,0.09);
    --text-primary: #ececea;
    --text-secondary: rgba(236,236,234,0.62);
    --text-tertiary: rgba(236,236,234,0.4);
    --accent: #8b85f3;
    --accent-soft: rgba(139,133,243,0.14);
    --erro-texto: #f2a9a5;
    --erro-fundo: rgba(239,68,68,0.1);
    --erro-borda: rgba(239,68,68,0.3);
    --ok-texto: #7fd8a0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .topbar { border-bottom: 1px solid var(--border-soft); }
  .topbar-linha {
    max-width: var(--largura-conteudo);
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
  }
  .voltar, .btn-tema {
    width: 32px; height: 32px;
    border-radius: var(--radius-sm);
    background: transparent;
    border: 1px solid var(--border-soft);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary);
    text-decoration: none; cursor: pointer; flex-shrink: 0;
  }
  .btn-tema { margin-left: auto; }
  .topbar-titulo h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .topbar-titulo p { font-size: 12.5px; color: var(--text-tertiary); margin: 1px 0 0; }

  .conteudo {
    max-width: var(--largura-conteudo);
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  .aviso {
    color: var(--text-secondary);
    background: var(--bg-card-usuario);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    font-size: 14px;
  }
  .aviso a { color: var(--accent); }

  .cartoes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 28px;
  }
  .cartao {
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    padding: 14px 16px;
  }
  .cartao .numero { font-size: 24px; font-weight: 700; line-height: 1.1; }
  .cartao .rotulo { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; }

  h2 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .subtitulo {
    font-size: 12.5px;
    color: var(--text-tertiary);
    margin: 0 0 14px;
  }

  .tabela-wrap {
    overflow-x: auto;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-soft);
    vertical-align: top;
  }
  th { color: var(--text-tertiary); font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.02em; }
  tr:last-child td { border-bottom: none; }
  td.pergunta { max-width: 360px; }
  .sql-mini {
    margin-top: 4px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 11px;
    color: var(--text-tertiary);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 999px;
    border: 1px solid var(--border-soft);
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .tag-negativo { color: var(--erro-texto); border-color: var(--erro-borda); }
  .tag-falha { color: var(--erro-texto); border-color: var(--erro-borda); }
  .erro-texto { color: var(--erro-texto); font-size: 12px; }
  .vazio { color: var(--text-tertiary); font-size: 13.5px; padding: 20px; text-align: center; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-linha">
      <a href="assistente.html" class="voltar" aria-label="Voltar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="topbar-titulo">
        <h1>Painel do Assistente</h1>
        <p>GECOPE · uso e falhas do Assistente de Dados</p>
      </div>
      <button class="btn-tema" id="btnTema" aria-label="Alternar tema">
        <svg id="iconeTema" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </div>

  <div class="conteudo" id="conteudo">
    <p class="aviso">Carregando…</p>
  </div>

<script>
  const SUPABASE_URL = window.SUPABASE_URL;
  const SUPABASE_ANON_KEY = window.SUPABASE_KEY;
  const PAINEL_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/gecope-assistant-painel`;

  const CHAVE_TEMA = "gecope-tema";
  const ICONE_LUA = `<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>`;
  const ICONE_SOL = `<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/>`;
  const btnTema = document.getElementById("btnTema");
  const iconeTema = document.getElementById("iconeTema");
  function aplicarTema(tema) {
    document.documentElement.dataset.theme = tema;
    iconeTema.innerHTML = tema === "escuro" ? ICONE_SOL : ICONE_LUA;
    localStorage.setItem(CHAVE_TEMA, tema);
  }
  aplicarTema(localStorage.getItem(CHAVE_TEMA) ?? (window.matchMedia?.("(prefers-color-scheme: dark)").matches ? "escuro" : "claro"));
  btnTema.addEventListener("click", () => {
    aplicarTema(document.documentElement.dataset.theme === "escuro" ? "claro" : "escuro");
  });

  const conteudo = document.getElementById("conteudo");

  function escaparHtml(texto) {
    const div = document.createElement("div");
    div.textContent = texto ?? "";
    return div.innerHTML;
  }

  const ROTULO_ORIGEM = {
    intencao: "Resposta imediata",
    gemini: "Resposta gerada (IA)",
    gemini_esclarecimento: "Pediu esclarecimento",
    gemini_fora_escopo: "Fora do escopo",
    gemini_degradado: "IA não conseguiu",
    degradado: "IA indisponível",
    erro: "Erro do sistema",
  };

  function montarPainel(dados) {
    const pctImediata = dados.total ? Math.round(((dados.porOrigem.intencao ?? 0) / dados.total) * 100) : 0;
    const avisoTruncado = dados.totalTruncado
      ? `<p class="aviso" style="margin-bottom:20px;">Mostrando as últimas ${dados.total} perguntas (há mais no histórico).</p>`
      : "";

    const linhasProblemas = dados.problemas.length
      ? dados.problemas.map((p) => `
          <tr>
            <td>${p.id}</td>
            <td>${new Date(p.criadoEm).toLocaleString("pt-BR")}</td>
            <td class="pergunta">
              ${escaparHtml(p.pergunta)}
              ${p.sqlGerado ? `<div class="sql-mini">${escaparHtml(p.sqlGerado)}</div>` : ""}
            </td>
            <td><span class="tag">${escaparHtml(ROTULO_ORIGEM[p.origem] ?? p.origem ?? "—")}</span></td>
            <td>${p.erro ? `<span class="erro-texto">${escaparHtml(p.erro)}</span>` : "—"}</td>
            <td>${p.veredito === "negativo" ? '<span class="tag tag-negativo">👎</span>' : p.veredito === "positivo" ? '<span class="tag">👍</span>' : "—"}</td>
          </tr>
        `).join("")
      : `<tr><td colspan="6" class="vazio">Nenhuma falha ou 👎 registrado ainda.</td></tr>`;

    conteudo.innerHTML = `
      <p class="aviso" style="margin-bottom:20px;">
        Página de acompanhamento do assistente — destinada a quem administra o assistente.
        As perguntas abaixo são de todos os usuários; trate como dado sensível (pode conter
        nome de fiscal/analista) e não compartilhe fora do GECOPE.
      </p>
      ${avisoTruncado}
      <div class="cartoes">
        <div class="cartao"><div class="numero">${dados.total}</div><div class="rotulo">Perguntas (últimas)</div></div>
        <div class="cartao"><div class="numero">${pctImediata}%</div><div class="rotulo">Resposta imediata</div></div>
        <div class="cartao"><div class="numero">${dados.sucessos}</div><div class="rotulo">Com sucesso</div></div>
        <div class="cartao"><div class="numero">${dados.falhas}</div><div class="rotulo">Com falha</div></div>
        <div class="cartao"><div class="numero">👍 ${dados.positivos}</div><div class="rotulo">Feedback positivo</div></div>
        <div class="cartao"><div class="numero">👎 ${dados.negativos}</div><div class="rotulo">Feedback negativo</div></div>
      </div>

      <h2>Perguntas com falha ou 👎</h2>
      <p class="subtitulo">Matéria-prima da rotina de revisão — ver <code>docs/assistente/rotina-revisao-falhas.md</code>.</p>
      <div class="tabela-wrap">
        <table>
          <thead><tr><th>Id</th><th>Quando</th><th>Pergunta / SQL gerado</th><th>Origem</th><th>Erro</th><th>Voto</th></tr></thead>
          <tbody>${linhasProblemas}</tbody>
        </table>
      </div>
    `;
  }

  (async function iniciar() {
    for (let i = 0; i < 20 && !window.sbClient; i++) {
      await new Promise((r) => setTimeout(r, 100));
    }
    const { data } = window.sbClient ? await window.sbClient.auth.getSession() : { data: null };
    const token = data?.session?.access_token;
    if (!token) {
      conteudo.innerHTML = '<p class="aviso">Abra o <a href="index.html">Painel Principal</a>, faça login e volte a esta página.</p>';
      return;
    }

    try {
      const resposta = await fetch(PAINEL_FUNCTION_URL, {
        headers: { "Authorization": `Bearer ${token}`, "apikey": SUPABASE_ANON_KEY },
      });
      const dados = await resposta.json();
      if (!resposta.ok) {
        conteudo.innerHTML = `<p class="aviso">${escaparHtml(dados.erro || "Não consegui carregar o painel.")}</p>`;
        return;
      }
      montarPainel(dados);
    } catch (e) {
      console.error(e);
      conteudo.innerHTML = '<p class="aviso">Não consegui me conectar ao painel agora. Tente novamente em instantes.</p>';
    }
  })();
</script>
</body>
</html>
