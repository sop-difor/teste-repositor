<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistente de Dados · GECOPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<!-- Supabase: mesmo cliente/sessão do restante do GECOPE (config.js define URL/chave,
     database.js inicializa window.sbClient reaproveitando a sessão já autenticada).
     A integração completa (link no index.html, tema unificado) é a F8; a F1 só faz o
     assistente exigir uma sessão real do GECOPE em vez da anon key crua. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="database.js"></script>
<style>
  :root {
    --bg-page: #ffffff;
    --bg-card-usuario: #f2f2f0;
    --border-soft: #e8e8e5;
    --text-primary: #262624;
    --text-secondary: #6b6b68;
    --text-tertiary: #9c9c98;
    --accent: #4f46e5;
    --accent-soft: #eef0fd;
    --erro-texto: #b3261e;
    --erro-fundo: #fdf2f2;
    --erro-borda: #f5c2c2;
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --largura-conteudo: 920px;
  }

  html[data-theme="escuro"] {
    --bg-page: #1a1a18;
    --bg-card-usuario: #2a2a27;
    --border-soft: rgba(255,255,255,0.09);
    --text-primary: #ececea;
    --text-secondary: rgba(236,236,234,0.62);
    --text-tertiary: rgba(236,236,234,0.4);
    --accent: #8b85f3;
    --accent-soft: rgba(139,133,243,0.14);
    --erro-texto: #f2a9a5;
    --erro-fundo: rgba(239,68,68,0.1);
    --erro-borda: rgba(239,68,68,0.3);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  /* ---------- Cabeçalho ---------- */
  .topbar {
    flex-shrink: 0;
    border-bottom: 1px solid var(--border-soft);
  }

  .topbar-linha {
    max-width: var(--largura-conteudo);
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
  }

  .voltar, .btn-tema {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    background: transparent;
    border: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    text-decoration: none;
    cursor: pointer;
    flex-shrink: 0;
  }

  .btn-tema { margin-left: auto; }

  .topbar-titulo h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
  }

  .topbar-titulo p {
    font-size: 12.5px;
    color: var(--text-tertiary);
    margin: 1px 0 0;
  }

  /* ---------- Chips de sugestão ---------- */
  .sugestoes-wrap {
    flex-shrink: 0;
    padding: 10px 0;
  }

  .sugestoes {
    max-width: var(--largura-conteudo);
    margin: 0 auto;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0 20px;
    scrollbar-width: none;
  }
  .sugestoes::-webkit-scrollbar { display: none; }

  /* Em telas largas (desktop), os chips quebram em várias linhas em vez de
     ficarem escondidos numa rolagem horizontal — isso só faz sentido em
     telas estreitas, onde rolar de lado é um padrão já conhecido. */
  @media (min-width: 640px) {
    .sugestoes {
      flex-wrap: wrap;
      overflow-x: visible;
      row-gap: 8px;
    }
  }

  .chip {
    flex-shrink: 0;
    background: transparent;
    border: 1px solid var(--border-soft);
    color: var(--text-secondary);
    font-size: 12.5px;
    font-family: inherit;
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- Conversa (estilo Claude: texto corrido, sem balão pro assistente) ---------- */
  .conversa {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px 12px;
  }

  .conversa-interna {
    max-width: var(--largura-conteudo);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .estado-vazio {
    margin: auto;
    text-align: center;
    max-width: 320px;
    padding-top: 12vh;
  }
  .logo-estado-vazio {
    width: 52px;
    height: 52px;
    object-fit: contain;
    margin: 0 auto 16px;
    display: block;
  }
  .estado-vazio h2 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 6px;
    color: var(--text-primary);
  }
  .estado-vazio p {
    font-size: 14px;
    line-height: 1.5;
    margin: 0;
    color: var(--text-tertiary);
  }

  .turno-usuario {
    display: flex;
    justify-content: flex-end;
  }

  .bolha-usuario {
    max-width: 82%;
    background: var(--bg-card-usuario);
    border-radius: var(--radius-md);
    padding: 10px 15px;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .turno-assistente {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .avatar-assistente {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .conteudo-assistente {
    flex: 1;
    min-width: 0;
    font-size: 15.5px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .conteudo-assistente.erro {
    color: var(--erro-texto);
    background: var(--erro-fundo);
    border: 1px solid var(--erro-borda);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    font-size: 14px;
  }

  /* Aviso (sessão, limite de uso): não é falha do sistema — tom neutro, não vermelho. */
  .conteudo-assistente.aviso {
    color: var(--text-secondary);
    background: var(--bg-card-usuario);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    font-size: 14px;
  }

  .chip.chip-off {
    opacity: 0.4;
    pointer-events: none;
  }

  .badge-origem {
    display: block;
    font-size: 11px;
    color: var(--text-tertiary);
    margin-top: 8px;
  }

  .grafico-wrap {
    margin-top: 14px;
    padding: 16px 16px 8px;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    max-width: 620px;
    height: 260px;
    position: relative;
  }

  /* ---------- F6: SQL gerado (recolhível) ---------- */
  .sql-toggle {
    display: inline-block;
    margin-top: 8px;
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-tertiary);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .sql-toggle:hover { color: var(--accent); }

  .sql-bloco {
    margin-top: 8px;
    padding: 10px 12px;
    background: var(--bg-card-usuario);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text-secondary);
    white-space: pre-wrap;
    word-break: break-word;
    overflow-x: auto;
  }

  /* ---------- F6: sugestões anexadas a uma mensagem de degradação ---------- */
  .sugestoes-turno {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  /* ---------- F7: voto 👍/👎 sobre uma resposta ---------- */
  .feedback-turno {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .feedback-btn {
    background: transparent;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    font-size: 13px;
    padding: 4px 9px;
    cursor: pointer;
    opacity: 0.55;
    transition: opacity 0.15s ease, border-color 0.15s ease;
  }
  .feedback-btn:hover:not(:disabled) { opacity: 1; border-color: var(--accent); }
  .feedback-btn:disabled { cursor: default; }
  .feedback-btn-escolhido { opacity: 1; border-color: var(--accent); background: var(--accent-soft); }
  .feedback-status { font-size: 12px; color: var(--text-tertiary); }

  .digitando { display: flex; gap: 4px; padding: 6px 0; }
  .digitando span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-tertiary);
    animation: pulsar 1.1s infinite ease-in-out;
  }
  .digitando span:nth-child(2) { animation-delay: 0.15s; }
  .digitando span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulsar {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-2px); }
  }

  /* ---------- Campo de entrada ---------- */
  .entrada-wrap {
    flex-shrink: 0;
    padding: 10px 20px calc(16px + env(safe-area-inset-bottom));
  }

  .entrada {
    max-width: var(--largura-conteudo);
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--bg-page);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    padding: 8px 8px 8px 18px;
    box-shadow: 0 1px 8px rgba(0,0,0,0.05);
  }

  .entrada textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 15px;
    line-height: 1.4;
    max-height: 120px;
    padding: 7px 0;
  }
  .entrada textarea::placeholder { color: var(--text-tertiary); }

  .btn-enviar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--text-primary);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity 0.15s ease;
  }
  html[data-theme="escuro"] .btn-enviar { background: var(--accent); }
  .btn-enviar:disabled { opacity: 0.3; cursor: default; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-linha">
      <a href="index.html" class="voltar" aria-label="Voltar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="topbar-titulo">
        <h1>Assistente de Dados</h1>
        <p>GECOPE · processos, contratos e aditivos</p>
      </div>
      <button class="btn-tema" id="btnTema" aria-label="Alternar tema">
        <svg id="iconeTema" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </div>

  <div class="sugestoes-wrap">
    <div class="sugestoes" id="sugestoes">
      <button class="chip">Quantos contratos estão paralisados?</button>
      <button class="chip">Contratos vencendo no próximo mês</button>
      <button class="chip">Valor total de aditivos aprovados este mês</button>
      <button class="chip">Processos de replanilhamento em tramitação</button>
      <button class="chip">Qual contrato tem mais aditivos?</button>
      <button class="chip">Contratos com percentual de aditivo acima de 25%</button>
    </div>
  </div>

  <div class="conversa" id="conversa">
    <div class="conversa-interna" id="conversaInterna">
      <div class="estado-vazio" id="estadoVazio">
        <img
          src="logo-estado-ceara.png"
          alt="Governo do Estado do Ceará"
          class="logo-estado-vazio"
          onerror="this.style.display='none'"
        >
        <!-- Troque o "src" acima pelo caminho real do brasão/logotipo do
             Estado já usado no restante do GECOPE (ex: assets/brasao-ceara.png).
             Se o arquivo não for encontrado, a imagem some sozinha (onerror)
             em vez de quebrar o layout com um ícone de imagem faltando. -->
        <h2 id="saudacaoVazio">Olá.</h2>
        <p>Pergunte sobre processos, contratos e aditivos do GECOPE.</p>
      </div>
    </div>
  </div>

  <div class="entrada-wrap">
    <div class="entrada">
      <textarea id="campoTexto" rows="1" placeholder="Pergunte algo sobre processos, contratos, aditivos..."></textarea>
      <button class="btn-enviar" id="btnEnviar" aria-label="Enviar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>

<script>
  // ---------------------------------------------------------------------
  // CONFIGURAÇÃO — URL e anon key vêm de config.js (window.SUPABASE_URL /
  // window.SUPABASE_KEY), as mesmas do resto do GECOPE. A anon key só é usada
  // no header `apikey` (exigido pelo gateway); a identidade de quem pergunta
  // vai no `Authorization: Bearer <access_token>` da sessão real — a Edge
  // Function valida com auth.getUser e deriva o usuário do token.  [F1]
  // ---------------------------------------------------------------------
  const SUPABASE_URL = window.SUPABASE_URL;
  const SUPABASE_ANON_KEY = window.SUPABASE_KEY;
  const EDGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/gecope-assistant`;

  // Token de acesso da sessão atual do GECOPE. Sem sessão → null (a UI bloqueia
  // a entrada e mostra o aviso de login). Espera o database.js inicializar o
  // window.sbClient (mesmo padrão de carregamento do resto do GECOPE).
  async function obterTokenSessao() {
    try {
      for (let i = 0; i < 20 && !window.sbClient; i++) {
        await new Promise((r) => setTimeout(r, 100));
      }
      if (!window.sbClient) return null;
      const { data } = await window.sbClient.auth.getSession();
      return data?.session?.access_token ?? null;
    } catch {
      return null;
    }
  }

  // ---------------------------------------------------------------------
  // Tema claro/escuro — ver nota sobre alinhar com o resto do GECOPE
  // ---------------------------------------------------------------------
  const CHAVE_TEMA = "gecope-tema";
  const ICONE_LUA = `<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>`;
  const ICONE_SOL = `<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/>`;
  const btnTema = document.getElementById("btnTema");
  const iconeTema = document.getElementById("iconeTema");

  function aplicarTema(tema) {
    document.documentElement.dataset.theme = tema;
    iconeTema.innerHTML = tema === "escuro" ? ICONE_SOL : ICONE_LUA;
    localStorage.setItem(CHAVE_TEMA, tema);
  }
  aplicarTema(localStorage.getItem(CHAVE_TEMA) ?? (window.matchMedia?.("(prefers-color-scheme: dark)").matches ? "escuro" : "claro"));
  btnTema.addEventListener("click", () => {
    aplicarTema(document.documentElement.dataset.theme === "escuro" ? "claro" : "escuro");
  });

  const VARIACOES_SAUDACAO = {
    manha: ["Bom dia", "Bom dia, gestor", "Um bom dia pra você"],
    tarde: ["Boa tarde", "Boa tarde, gestor", "Uma boa tarde pra você"],
    noite: ["Boa noite", "Boa noite, gestor", "Uma boa noite pra você"],
  };

  function obterPrimeiroNome() {
    const nomeCompleto = window.currentUser?.nome ?? "";
    if (!nomeCompleto) return null;
    return nomeCompleto.trim().split(/\s+/)[0];
  }

  function montarSaudacao() {
    const hora = new Date().getHours();
    const periodo = hora < 12 ? "manha" : hora < 18 ? "tarde" : "noite";
    const opcoes = VARIACOES_SAUDACAO[periodo];
    const escolhida = opcoes[Math.floor(Math.random() * opcoes.length)];
    const primeiroNome = obterPrimeiroNome();
    // evita duplicar "gestor" quando já temos o nome de verdade
    const base = primeiroNome ? escolhida.replace(", gestor", "") : escolhida;
    return primeiroNome ? `${base}, ${primeiroNome}.` : `${base}.`;
  }

  const saudacaoEl = document.getElementById("saudacaoVazio");
  if (saudacaoEl) saudacaoEl.textContent = montarSaudacao();

  // ---------------------------------------------------------------------
  const conversaInterna = document.getElementById("conversaInterna");
  const conversa = document.getElementById("conversa");
  const estadoVazio = document.getElementById("estadoVazio");
  const campoTexto = document.getElementById("campoTexto");
  const btnEnviar = document.getElementById("btnEnviar");
  const sugestoes = document.getElementById("sugestoes");
  let contadorGrafico = 0;
  let esclarecimentoPendente = null;

  campoTexto.addEventListener("input", () => {
    campoTexto.style.height = "auto";
    campoTexto.style.height = Math.min(campoTexto.scrollHeight, 120) + "px";
  });

  campoTexto.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      enviarPergunta(campoTexto.value);
    }
  });

  btnEnviar.addEventListener("click", () => enviarPergunta(campoTexto.value));
  sugestoes.addEventListener("click", (e) => {
    if (e.target.classList.contains("chip") && !e.target.classList.contains("chip-off")) {
      enviarPergunta(e.target.textContent);
    }
  });

  // ---------------------------------------------------------------------
  // F1: porta de sessão. Sem sessão do GECOPE (nunca teve, ou expirou no meio),
  // o assistente não funciona — desabilita entrada + chips e explica, com um
  // caminho clicável. A integração plena (redirecionar para o login, herdar o
  // nome do usuário no cabeçalho) é a F8.
  // ---------------------------------------------------------------------
  let sessaoOk = false;
  const PLACEHOLDER_PADRAO = campoTexto.getAttribute("placeholder");

  function travarEntrada() {
    sessaoOk = false;
    campoTexto.disabled = true;
    btnEnviar.disabled = true;
    sugestoes.querySelectorAll(".chip").forEach((c) => c.classList.add("chip-off"));
  }

  // Chamada quando confirmamos que NÃO há sessão (na carga, em token nulo no
  // envio, ou em resposta 401 da Edge Function). Mostra o aviso com link.
  function fecharPorSessao() {
    travarEntrada();
    campoTexto.placeholder = "Entre no GECOPE para usar o assistente";
    const alvo = document.getElementById("saudacaoVazio");
    if (alvo && !alvo.dataset.sessaoAviso) {
      alvo.dataset.sessaoAviso = "1";
      alvo.textContent = "Entre no GECOPE para continuar";
      const p = alvo.nextElementSibling;
      if (p) p.innerHTML = 'Abra o <a href="index.html" style="color:var(--accent)">Painel Principal</a>, faça login e volte a esta página.';
    }
  }

  function abrirPorSessao() {
    sessaoOk = true;
    campoTexto.disabled = false;
    campoTexto.placeholder = PLACEHOLDER_PADRAO;
    btnEnviar.disabled = false;
    sugestoes.querySelectorAll(".chip").forEach((c) => c.classList.remove("chip-off"));
  }

  // começa travado (sem mostrar o aviso ainda) até confirmar a sessão —
  // evita "flash" de UI funcional para quem está deslogado.
  travarEntrada();
  (async function portaDeSessaoInicial() {
    const token = await obterTokenSessao();
    if (token) abrirPorSessao();
    else fecharPorSessao();
  })();

  function adicionarTurnoUsuario(texto) {
    if (estadoVazio) estadoVazio.remove();
    const turno = document.createElement("div");
    turno.className = "turno-usuario";
    turno.innerHTML = `<div class="bolha-usuario"></div>`;
    turno.querySelector(".bolha-usuario").textContent = texto;
    conversaInterna.appendChild(turno);
    conversa.scrollTop = conversa.scrollHeight;
  }

  function renderizarTabelaFallback(container, grafico) {
    container.style.height = "auto";
    const linhasTabela = grafico.rotulos
      .map((rotulo, i) => `<tr><td>${rotulo}</td><td style="text-align:right; font-variant-numeric: tabular-nums;">${grafico.valores[i].toLocaleString("pt-BR")}</td></tr>`)
      .join("");
    container.innerHTML = `
      <p style="font-size:12.5px; color:var(--text-tertiary); margin:0 0 8px;">${grafico.titulo}</p>
      <table style="width:100%; border-collapse:collapse; font-size:14px;">${linhasTabela}</table>
    `;
    container.querySelectorAll("tr").forEach((tr) => {
      tr.style.borderBottom = "1px solid var(--border-soft)";
      tr.querySelectorAll("td").forEach((td) => { td.style.padding = "6px 4px"; });
    });
  }

  function renderizarGrafico(canvasOuWrap, grafico) {
    if (typeof Chart === "undefined") {
      renderizarTabelaFallback(canvasOuWrap.parentElement, grafico);
      canvasOuWrap.remove();
      return;
    }
    try {
      new Chart(canvasOuWrap, {
        type: grafico.tipo === "linha" ? "line" : "bar",
        data: {
          labels: grafico.rotulos,
          datasets: [{
            data: grafico.valores,
            backgroundColor: getComputedStyle(document.documentElement).getPropertyValue("--accent").trim(),
            borderColor: getComputedStyle(document.documentElement).getPropertyValue("--accent").trim(),
            borderRadius: 4,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, title: { display: true, text: grafico.titulo, font: { size: 13 } } },
          scales: {
            y: { beginAtZero: true, ticks: { precision: 0 } },
            x: { ticks: { autoSkip: false, maxRotation: 30, minRotation: 0 } },
          },
        },
      });
    } catch (erro) {
      console.error("Chart.js falhou ao renderizar, usando tabela:", erro);
      renderizarTabelaFallback(canvasOuWrap.parentElement, grafico);
      canvasOuWrap.remove();
    }
  }

  function adicionarTurnoAssistente(
    texto,
    { erro = false, aviso = false, origem = null, grafico = null, esclarecimento = false, sql = null, sugestoes = null, logId = null } = {}
  ) {
    if (estadoVazio) estadoVazio.remove();

    const turno = document.createElement("div");
    turno.className = "turno-assistente";

    const semAvatar = erro || aviso;
    const avatar = semAvatar ? "" : `<div class="avatar-assistente"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="8.5"/></svg></div>`;
    const classeExtra = erro ? " erro" : aviso ? " aviso" : "";

    turno.innerHTML = `
      ${avatar}
      <div class="conteudo-assistente${classeExtra}"></div>
    `;
    turno.querySelector(".conteudo-assistente").textContent = texto;

    if (esclarecimento) {
      const badge = document.createElement("span");
      badge.className = "badge-origem";
      badge.textContent = "preciso de mais detalhes";
      turno.querySelector(".conteudo-assistente").appendChild(badge);
    } else if (origem && !erro) {
      const badge = document.createElement("span");
      badge.className = "badge-origem";
      badge.textContent = origem === "intencao" ? "resposta imediata" : "resposta gerada — confira";
      turno.querySelector(".conteudo-assistente").appendChild(badge);
    }

    conversaInterna.appendChild(turno);

    if (grafico && grafico.rotulos?.length) {
      const wrap = document.createElement("div");
      wrap.className = "grafico-wrap";
      const canvasId = `grafico-${++contadorGrafico}`;
      wrap.innerHTML = `<canvas id="${canvasId}"></canvas>`;
      turno.querySelector(".conteudo-assistente").appendChild(wrap);
      renderizarGrafico(document.getElementById(canvasId), grafico);
    }

    // F6: SQL gerado, recolhido por padrão — quem quiser conferir clica.
    if (sql) {
      const conteudo = turno.querySelector(".conteudo-assistente");
      const botao = document.createElement("button");
      botao.type = "button";
      botao.className = "sql-toggle";
      botao.textContent = "▸ Ver SQL gerado";
      const bloco = document.createElement("pre");
      bloco.className = "sql-bloco";
      bloco.textContent = sql;
      bloco.hidden = true;
      botao.addEventListener("click", () => {
        bloco.hidden = !bloco.hidden;
        botao.textContent = bloco.hidden ? "▸ Ver SQL gerado" : "▾ Ocultar SQL gerado";
      });
      conteudo.appendChild(botao);
      conteudo.appendChild(bloco);
    }

    // F7: 👍/👎 — só nas respostas de verdade (a Edge Function só manda
    // logId para intenção e Gemini-com-SQL; esclarecimento/degradação/erro
    // não têm "uma resposta" pra avaliar, por isso nunca chegam com logId).
    if (logId != null) {
      const conteudo = turno.querySelector(".conteudo-assistente");
      const wrap = document.createElement("div");
      wrap.className = "feedback-turno";
      // Achado do rev-produto (F7): só os emojis, sem rótulo, podem não ser
      // óbvios pra quem não usa apps de chat no dia a dia.
      const rotuloFeedback = document.createElement("span");
      rotuloFeedback.className = "feedback-status";
      rotuloFeedback.textContent = "Essa resposta ajudou?";
      wrap.appendChild(rotuloFeedback);
      const btnPositivo = document.createElement("button");
      btnPositivo.type = "button";
      btnPositivo.className = "feedback-btn";
      btnPositivo.setAttribute("aria-label", "Resposta útil");
      btnPositivo.textContent = "👍";
      const btnNegativo = document.createElement("button");
      btnNegativo.type = "button";
      btnNegativo.className = "feedback-btn";
      btnNegativo.setAttribute("aria-label", "Resposta não ajudou");
      btnNegativo.textContent = "👎";
      // Achado do rev-produto (F7): a Edge Function já devolvia "Obrigado
      // pelo retorno", mas o front-end nunca mostrava — só a cor do botão
      // mudava, sutil demais. E marcar como votado ANTES de saber se deu
      // certo fazia a tela "mentir" se a sessão caiu ou a rede falhou.
      const status = document.createElement("span");
      status.className = "feedback-status";
      status.hidden = true;

      const votar = async (veredito, botaoClicado) => {
        btnPositivo.disabled = true;
        btnNegativo.disabled = true;
        status.hidden = false;
        status.textContent = "Enviando…";
        const deuCerto = await enviarFeedback(logId, veredito);
        if (deuCerto) {
          botaoClicado.classList.add("feedback-btn-escolhido");
          status.textContent = "Obrigado pelo retorno.";
        } else {
          status.textContent = "Não consegui registrar. Tente de novo.";
          btnPositivo.disabled = false;
          btnNegativo.disabled = false;
        }
      };
      btnPositivo.addEventListener("click", () => votar("positivo", btnPositivo));
      btnNegativo.addEventListener("click", () => votar("negativo", btnNegativo));

      wrap.appendChild(btnPositivo);
      wrap.appendChild(btnNegativo);
      wrap.appendChild(status);
      conteudo.appendChild(wrap);
    }

    // F6: perguntas de exemplo anexadas a uma mensagem de degradação — clicar
    // já reenvia, sem precisar rolar até os chips fixos do rodapé.
    if (sugestoes && sugestoes.length) {
      const wrap = document.createElement("div");
      wrap.className = "sugestoes-turno";
      for (const pergunta of sugestoes) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.textContent = pergunta;
        chip.addEventListener("click", () => enviarPergunta(pergunta));
        wrap.appendChild(chip);
      }
      turno.querySelector(".conteudo-assistente").appendChild(wrap);
    }

    conversa.scrollTop = conversa.scrollHeight;
  }

  function mostrarDigitando() {
    const turno = document.createElement("div");
    turno.className = "turno-assistente";
    turno.id = "turnoDigitando";
    turno.innerHTML = `
      <div class="avatar-assistente"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="8.5"/></svg></div>
      <div class="digitando"><span></span><span></span><span></span></div>
    `;
    conversaInterna.appendChild(turno);
    conversa.scrollTop = conversa.scrollHeight;
  }

  function removerDigitando() {
    document.getElementById("turnoDigitando")?.remove();
  }

  // F7: envia o voto 👍/👎 sobre uma resposta já dada. Devolve true/false —
  // achado do rev-produto: marcar como "votado" sem saber se funcionou faz a
  // tela "mentir" pro usuário quando a sessão caiu ou a rede falhou.
  async function enviarFeedback(logId, veredito) {
    try {
      const token = await obterTokenSessao();
      if (!token) return false;
      const resposta = await fetch(EDGE_FUNCTION_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`,
          "apikey": SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({ tipo: "feedback", logId, veredito }),
      });
      return resposta.ok;
    } catch (e) {
      console.error("Falha ao enviar feedback:", e);
      return false;
    }
  }

  async function enviarPergunta(textoOriginal) {
    const texto = textoOriginal.trim();
    if (!texto) return;

    // F1: sem sessão do GECOPE, não há a quem atribuir a pergunta nem token
    // para a Edge Function validar. Fecha a porta de sessão (entrada + chips +
    // aviso com link) em vez de só mostrar um balão.
    const token = await obterTokenSessao();
    if (!token) {
      fecharPorSessao();
      adicionarTurnoAssistente(
        "Sua sessão do GECOPE não está ativa. Abra o Painel Principal, faça login e recarregue esta página.",
        { aviso: true }
      );
      return;
    }

    campoTexto.value = "";
    campoTexto.style.height = "auto";
    btnEnviar.disabled = true;

    adicionarTurnoUsuario(texto);
    mostrarDigitando();

    // Se há um esclarecimento pendente, junta a pergunta original com a
    // resposta do usuário antes de enviar — assim o Gemini recebe o contexto
    // completo, sem precisarmos manter um histórico de conversa inteiro.
    const perguntaParaEnviar = esclarecimentoPendente
      ? `Pergunta original: "${esclarecimentoPendente}". Detalhe adicional fornecido pelo usuário em resposta ao pedido de esclarecimento: "${texto}"`
      : texto;
    esclarecimentoPendente = null;

    try {
      const resposta = await fetch(EDGE_FUNCTION_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`,
          "apikey": SUPABASE_ANON_KEY,
        },
        // F1: "usuario" não vai mais no corpo — a Edge Function deriva do token.
        body: JSON.stringify({ pergunta: perguntaParaEnviar }),
      });

      const dados = await resposta.json();
      removerDigitando();

      if (resposta.status === 401 || dados.origem === "sessao") {
        // F1: sessão caiu no meio do uso — fecha a porta e orienta, sem balão
        // vermelho de "erro".
        fecharPorSessao();
        adicionarTurnoAssistente(
          dados.resposta || "Sua sessão do GECOPE expirou. Entre novamente e recarregue esta página.",
          { aviso: true }
        );
      } else if (resposta.status === 429 || dados.origem === "limite") {
        adicionarTurnoAssistente(dados.resposta || "Limite de perguntas por hora atingido. Aguarde alguns minutos.", { aviso: true });
      } else if (dados.origem === "degradado") {
        // Caminho LLM falhou — não é erro do sistema, é "não consegui".
        adicionarTurnoAssistente(dados.resposta || "Não consegui responder a essa pergunta agora. Tente reformular ou use uma sugestão.", { aviso: true, sugestoes: dados.sugestoes });
      } else if (!resposta.ok || dados.origem === "erro") {
        adicionarTurnoAssistente(dados.resposta || "Não consegui processar essa pergunta.", { erro: true });
      } else if (dados.precisaEsclarecimento) {
        // Guarda a pergunta que o usuário realmente quer responder, para
        // juntar com o que ele disser em seguida.
        esclarecimentoPendente = perguntaParaEnviar;
        adicionarTurnoAssistente(dados.resposta, { esclarecimento: true });
      } else if (dados.origem === "gemini" && !dados.sql) {
        // "Fora do escopo": o Gemini respondeu texto, mas não gerou SQL — é
        // degradação também (não é "análise gerada" de verdade), leva sugestões.
        adicionarTurnoAssistente(dados.resposta, { aviso: true, sugestoes: dados.sugestoes });
      } else {
        adicionarTurnoAssistente(dados.resposta, { origem: dados.origem, grafico: dados.grafico, sql: dados.sql, logId: dados.logId ?? null });
      }
    } catch (e) {
      removerDigitando();
      adicionarTurnoAssistente("Não consegui me conectar ao assistente agora. Tente novamente em instantes.", { erro: true });
      console.error(e);
    } finally {
      if (sessaoOk) btnEnviar.disabled = false;
    }
  }
</script>
